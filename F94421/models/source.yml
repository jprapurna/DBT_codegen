version: 2

sources:
  - name: Snowflake_CDM
    description: Source data from Snowflake CDM schema.
    database: Snowflake
    schema: CDM

    tables:
      - name: CDH_GW_BUR
        description: Table does not exist or not authorized.
        identifier: CDH_GW_BUR

      - name: DEV_CLM_BI_CDM_W_CLAIM_CD_BUR_SCD3
        description: Syntax error in table name.
        identifier: DEV_CLM_BI/CDM/W_CLAIM_CD_BUR_SCD3

      - name: SQ_CDH_GW_BUR
        description: Source query for CDH Gateway BUR.
        identifier: SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy.
            tests:
              - not_null
          - name: BUR
            description: BUR value.
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Name of the source.
            tests:
              - not_null

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim BUR SCD3.
        identifier: LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: LKP_ROW_WID
            description: Lookup row ID.
            tests:
              - not_null
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID.
            tests:
              - not_null
          - name: LKP_NEW_BUR
            description: Lookup new BUR value.
            tests:
              - not_null

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row ID.
        identifier: LKP_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Row ID.
            tests:
              - not_null
          - name: TABLE_NAME
            description: Name of the table.
            tests:
              - not_null

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for CDM batch control ID.
        identifier: LKP_CDM_BATCH_CTRLID
        columns:
          - name: SOURCE_NAME
            description: Name of the source.
            tests:
              - not_null
          - name: BATCH_ID
            description: Batch ID.
            tests:
              - not_null
          - name: STATUS
            description: Status of the batch.
            tests:
              - not_null