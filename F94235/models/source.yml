version: 2

sources:
  - name: GENAI_POWER_BI_CDM
    description: Source tables from GENAI_POWER_BI database in CDM schema.
    database: GENAI_POWER_BI
    schema: CDM

    tables:
      - name: CDH_GW_BUR
        description: Table 'CDH_GW_BUR' does not exist or not authorized.
        identifier: CDH_GW_BUR

      - name: W_CLAIM_CD_BUR_SCD3
        description: Table 'W_CLAIM_CD_BUR_SCD3' does not exist or not authorized.
        identifier: W_CLAIM_CD_BUR_SCD3

      - name: SQ_CDH_GW_BUR
        description: Table containing policy state, BUR, and source name.
        identifier: SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: Policy state column.
          - name: BUR
            description: BUR column.
          - name: SOURCE_NAME
            description: Source name column.

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim BUR SCD3.
        identifier: LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: LKP_ROW_WID
            description: Lookup row WID column.
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID column.
          - name: LKP_NEW_BUR
            description: Lookup new BUR column.

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row WID.
        identifier: LKP_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Row WID column.
          - name: TABLE_NAME
            description: Table name column.

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for CDM batch control ID.
        identifier: LKP_CDM_BATCH_CTRLID
        columns:
          - name: SOURCE_NAME
            description: Source name column.
          - name: BATCH_ID
            description: Batch ID column.
          - name: STATUS
            description: Status column.