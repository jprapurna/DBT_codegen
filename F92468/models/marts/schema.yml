version: 2

models:
  - name: fct_Output
    description: "Model for writing data to the target table from intermediate processing."
    meta:
      owner: data_team
      domain: claims_processing
    config:
      materialized: view
    tags: ['claims', 'output']
    columns:
      - name: row_wid
        description: "Unique identifier for each row in the output table."
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: o_Flag
        description: "Operation flag indicating the type of operation (Insert or Update)."
        tests:
          - not_null
          - accepted_values:
              values: ['I', 'U']
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['I', 'U']
      - name: claim_id
        description: "Identifier for the claim associated with the row."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('claims')
              field: claim_id
      - name: claim_amount
        description: "Monetary amount associated with the claim."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: claim_date
        description: "Date when the claim was processed."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: '2020-01-01'
              max_value: '2023-12-31'