    columns:
      - name: row_wid
        description: The unique identifier for each row in the CDM fact table.
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: other_column_1
        description: Description inferred from the intermediate model or transformations.
        tests:
          - not_null
      - name: other_column_2
