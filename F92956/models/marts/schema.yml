version: 2

models:
  - name: W_CLAIM_CD_BUR_SCD3_U
    description: This model updates data in the W_CLAIM_CD_BUR_SCD3_U table based on the update strategy expression, filtering records where the flag indicates an update.
    meta:
      owner: data_team
      domain: claims
    config:
      materialized: view
    tags: ['claims', 'update']
    columns:
      - name: INTEGRATION_ID
        description: Unique identifier for integration records.
        tests:
          - not_null
          - unique
      - name: o_Flag
        description: Flag indicating the operation type, specifically 'U' for updates.
        tests:
          - not_null
          - accepted_values:
              values: ['U']
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['U']
      - name: BATCH_ID
        description: Identifier for the batch process.
        tests:
          - not_null

  - name: W_CLAIM_CD_BUR_SCD3_I
    description: This model inserts data into the W_CLAIM_CD_BUR_SCD3_I table, filtering records where the flag indicates an insert.
    meta:
      owner: data_team
      domain: claims
    config:
      materialized: view
    tags: ['claims', 'insert']
    columns:
      - name: INTEGRATION_ID
        description: Unique identifier for integration records.
        tests:
          - not_null
          - unique
      - name: o_Flag
        description: Flag indicating the operation type, specifically 'I' for inserts.
        tests:
          - not_null
          - accepted_values:
              values: ['I']
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['I']
      - name: BATCH_ID
        description: Identifier for the batch process.
        tests:
          - not_null
      - name: ROW_WID
        description: Unique row identifier.
        tests:
          - not_null
          - unique

  - name: Output
    description: This model writes data to the target table, selecting the target table name and row identifier.
    meta:
      owner: data_team
      domain: output
    config:
      materialized: view
    tags: ['output', 'target']
    columns:
      - name: TGT_TABLE_NAME
        description: Name of the target table.
        tests:
          - not_null
      - name: ROW_WID
        description: Unique row identifier.
        tests:
          - not_null
          - unique