version: 2

models:
  - name: fct_w_claim_cd_bur_scd3  # Derived from the file name
    description: This model evaluates and flags changes in the `bur` field using SCD Type 3 logic, combining data from multiple sources and adding timestamps for insert and update operations.
    meta:
      owner: data_team  # Example metadata, adjust as needed
      domain: claims_processing
    config:
      materialized: table
    tags: [claims, scd3, bur]
    columns:
      - name: integration_id
        description: Unique identifier for the integration record.
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: bur
        description: Business unit reference or identifier.
        tests:
          - not_null
      - name: source_name
        description: Name of the source system providing the data.
        tests:
          - not_null
      - name: lkp_row_wid
        description: Lookup row identifier from the referenced table.
        tests:
          - not_null
          - relationships:
              to: ref('int_w_claim_cd_bur_scd3')
              field: lkp_row_wid
      - name: lkp_integration_id
        description: Integration ID from the lookup table for joining purposes.
        tests:
          - not_null
          - relationships:
              to: ref('int_w_claim_cd_bur_scd3')
              field: lkp_integration_id
      - name: lkp_new_bur
        description: New business unit reference from the lookup table.
        tests:
          - not_null
      - name: flag
        description: Flag indicating changes in the `bur` field based on SCD Type 3 evaluation.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['new', 'unchanged']
      - name: insert_dt
        description: Timestamp indicating when the record was inserted.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
      - name: update_dt
        description: Timestamp indicating when the record was last updated.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable