version: 2

models:
  - name: fct_m_FDR_FIRE_PLCY_TRANS_RSLT_PL  # Required
    description: Fact table for FDR Fire Policy Transaction Results. This model aggregates and processes data related to fire policy transactions, including workflow details, record counts, and source-target mappings.
    meta:
      owner: data_engineering_team
      domain: insurance
    config:
      materialized: table
    tags: [insurance, fire_policy, transactions]
    columns:
      - name: DW_CR_TMSP1
        description: Timestamp indicating when the record was created in the data warehouse.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
      - name: UPD_BY_MAPNG_ID1
        description: Mapping ID of the user or process that updated the record.
        tests:
          - not_null
      - name: DW_UPD_TMSP1
        description: Timestamp indicating when the record was last updated in the data warehouse.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
      - name: WRK_FLOW_RUN_ID1
        description: Identifier for the workflow run associated with the record.
        tests:
          - not_null
          - unique
      - name: TFPLCY_TRAN_RESULT_SK6
        description: Surrogate key for the fire policy transaction result.
        tests:
          - not_null
          - unique
      - name: SRC_SYS_HH_NUM6
        description: Source system identifier for the transaction.
        tests:
          - not_null
      - name: SRC_TRANS_TMSP6
        description: Timestamp of the source transaction.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
      - name: COMPONENT_MODULE_NAME6
        description: Name of the component module involved in the transaction.
        tests:
          - not_null
      - name: LOB_CD6
        description: Line of business code associated with the transaction.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['auto', 'home', 'life', 'health']
      - name: GATE_KPR_IND
        description: Indicator for gatekeeper status in the transaction process.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: BAL_ROW_COUNTS_SK
        description: Surrogate key for balanced row counts.
        tests:
          - not_null
          - unique
      - name: PROC_CD
        description: Code representing the process executed for the transaction.
        tests:
          - not_null
      - name: PRE_FDR_MAPNG_ID
        description: Mapping ID for the pre-FDR process.
        tests:
          - not_null
      - name: WORKFLOW_NAME1
        description: Name of the workflow associated with the transaction.
        tests:
          - not_null
      - name: WORKFLOW_COMPONENT_NAME1
        description: Name of the workflow component associated with the transaction.
        tests:
          - not_null
      - name: TARGET_TABLE_NAME1
        description: Name of the target table in the workflow.
        tests:
          - not_null
      - name: SOURCE_TABLE_NAME1
        description: Name of the source table in the workflow.
        tests:
          - not_null
      - name: RECRD_CNT_TYP_ACTN_INS1
        description: Record count type action for insert operations.
        tests:
          - not_null
      - name: RECRD_CNT_TYP_CD_RP_INS
        description: Record count type code for replace insert operations.
        tests:
          - not_null
      - name: o_RECRD_CNT_QTY
        description: Quantity of records counted for the operation.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: SRC_TBL_WRKFL_CMPNT_OBJ_ID
        description: Object ID of the source table workflow component.
        tests:
          - not_null
      - name: TRGT_TBL_WRKFL_CMPNT_OBJ_ID
        description: Object ID of the target table workflow component.
        tests:
          - not_null
      - name: TRGT_TBL_NM
        description: Name of the target table.
        tests:
          - not_null
      - name: SRC_TBL_NM
        description: Name of the source table.
        tests:
          - not_null
      - name: WRKFL_CMPNT_NM
        description: Name of the workflow component.
        tests:
          - not_null
      - name: RECRD_CNT_TYP_CD
        description: Code representing the record count type.
        tests:
          - not_null
      - name: RECRD_CNT_ACTN_CD
        description: Code representing the record count action.
        tests:
          - not_null
      - name: RECRD_CNT_QTY
        description: Quantity of records counted.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: WRKFL_RUN_ID
        description: Identifier for the workflow run.
        tests:
          - not_null
          - unique
      - name: WRKFL_NM
        description: Name of the workflow.
        tests:
          - not_null
      - name: TRGT_TBL_WRKFL_CMPNT_OBJ_ID
        description: Object ID of the target table workflow component.
        tests:
          - not_null
      - name: SRC_TBL_WRKFL_CMPNT_OBJ_ID
        description: Object ID of the source table workflow component.
        tests:
          - not_null