version: 2

sources:
  - name: CDH_GWODS
    description: Source for CDH Gateway data
    database: CDH_GWODS
    schema: CDH_GWODS

    tables:
      - name: DUMMY_SQ_CDH_GW_BUR
        description: Dummy table for CDH Gateway BUR
        identifier: DUMMY_SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR value
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Source name for the data
            tests:
              - not_null

  - name: CDM
    description: Claims Data Mart
    database: CDM
    schema: CDM

    tables:
      - name: DUMMY_LKP_W_CLAIM_CD_BUR_SCD3
        description: Dummy lookup table for claim BUR SCD3
        identifier: DUMMY_LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: lkp_ROW_WID
            description: Lookup row ID
            tests:
              - not_null
              - unique
          - name: lkp_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
          - name: lkp_NEW_BUR
            description: Lookup new BUR value
            tests:
              - not_null

      - name: DUMMY_mplt_CDM_BATCH_ID_lkp_CDM_BATCH_CTRLID
        description: Dummy mapplet lookup for CDM batch control ID
        identifier: DUMMY_mplt_CDM_BATCH_ID_lkp_CDM_BATCH_CTRLID
        columns:
          - name: BATCH_ID
            description: Batch ID
            tests:
              - not_null
              - unique
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null

      - name: DUMMY_mplt_CDM_ROW_WID_lkp_MAX_ROW_WID
        description: Dummy mapplet lookup for maximum row ID
        identifier: DUMMY_mplt_CDM_ROW_WID_lkp_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Maximum row ID
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Target table name
            tests:
              - not_null