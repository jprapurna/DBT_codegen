version: 2

sources:
  - name: CLAIM_DATA
    description: Source data for claim processing
    database: CLAIM_DATA
    schema: null

    tables:
      - name: SQ_CDH_GW_BUR
        description: Source query for CDH GW BUR
        identifier: SQ_CDH_GW_BUR

        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: Business unit reference
            tests:
              - not_null
              - unique
          - name: SOURCE_NAME
            description: Name of the source
            tests:
              - not_null
              - unique

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup for claim CD BUR SCD3
        identifier: LKP_W_CLAIM_CD_BUR_SCD3

        columns:
          - name: LKP_ROW_WID
            description: Lookup row ID
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
              - unique
          - name: LKP_NEW_BUR
            description: Lookup new business unit reference
            tests:
              - not_null
              - unique

      - name: lkp_CDM_BATCH_CTRLID
        description: Lookup for CDM batch control ID
        identifier: lkp_CDM_BATCH_CTRLID

        columns:
          - name: SOURCE_NAME
            description: Name of the source
            tests:
              - not_null
              - unique
          - name: BATCH_ID
            description: Batch ID
            tests:
              - not_null
              - unique

      - name: lkp_MAX_ROW_WID
        description: Lookup for maximum row ID
        identifier: lkp_MAX_ROW_WID

        columns:
          - name: ROW_WID
            description: Row ID
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table
            tests:
              - not_null
              - unique