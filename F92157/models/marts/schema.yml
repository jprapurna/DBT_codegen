version: 2

models:
  - name: fct_m_NU0C_TA_NISS_AUTO_ATPRM_DTL_Upd_ClassCd
    description: This model provides detailed information about class codes, including exception indicators and descriptions.
    meta:
      owner: data_team
      domain: insurance
    config:
      materialized: table
    tags: ['insurance', 'class_codes']
    columns:
      - name: NISS_APRM_DETL_SK
        description: Unique identifier for the APRM detail record.
        tests:
          - unique
          - not_null
      - name: NISS_CLASS_CD
        description: Code representing the class of the APRM detail.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['A', 'B', 'C', 'D']  # Example values inferred from business logic
      - name: REC_EXCPN_IND
        description: Indicator for record exceptions.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: REC_EXCP_DESC
        description: Description of the record exception.
        tests:
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              min_value: 0
              max_value: 255

  - name: fct_m_NU0C_NISS_AUTO_ATPRM_DTL_PostSQL_Upd_Dummy
    description: This model provides post-update details for APRM records, including state abbreviations, accounting lines of business, and coverage types.
    meta:
      owner: data_team
      domain: insurance
    config:
      materialized: table
    tags: ['insurance', 'post_update']
    columns:
      - name: NISS_APRM_DETL_SK
        description: Unique identifier for the APRM detail record.
        tests:
          - unique
          - not_null
      - name: ST_ABBR
        description: State abbreviation.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[A-Z]{2}$"
      - name: ACCTNG_LOB
        description: Accounting line of business.
        tests:
          - not_null
      - name: BI_LMT
        description: Bodily injury limit.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: PRD_GRP_CD
        description: Product group code.
        tests:
          - not_null
      - name: NJ_NO_LWST_LMT_IND
        description: Indicator for New Jersey no lowest limit.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: NJ_NMD_DRVR_EXCL_IND
        description: Indicator for New Jersey named driver exclusion.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: CVG_TYP_CD
        description: Coverage type code.
        tests:
          - not_null

  - name: fct_m_NU0C_NISS_AUTO_105_ATPRM_DTL_Upd_CvgCd
    description: This model provides detailed coverage information, including coverage amounts, limits, and indicators.
    meta:
      owner: data_team
      domain: insurance
    config:
      materialized: table
    tags: ['insurance', 'coverage']
    columns:
      - name: NISS_APRM_DETL_SK
        description: Unique identifier for the APRM detail record.
        tests:
          - unique
          - not_null
      - name: ST_NM
        description: State name.
        tests:
          - not_null
      - name: ST_ABBR
        description: State abbreviation.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[A-Z]{2}$"
      - name: ACCTNG_LOB
        description: Accounting line of business.
        tests:
          - not_null
      - name: CVG_TYP_CD
        description: Coverage type code.
        tests:
          - not_null
      - name: CVG_AMT
        description: Coverage amount.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: BI_LMT
        description: Bodily injury limit.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: GA_ADDED_AT_FAULT_IND
        description: Indicator for Georgia added-at-fault coverage.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: FA2_PLCY_IND
        description: Indicator for FA2 policy.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: UM_UMI_STACKING
        description: Indicator for UM/UMI stacking.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: PIP_WVR_WL_IND
        description: Indicator for PIP waiver.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: PIP_MED_SEC_IND
        description: Indicator for PIP medical section.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: PIP_LOSS_INCOME_IND
        description: Indicator for PIP loss income.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: MI_PPO_IND
        description: Indicator for Michigan PPO.
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Y', 'N']
      - name: COMP_DED
        description: Comprehensive deductible.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000
      - name: RATNG_CMPY_CD
        description: Rating company code.
        tests:
          - not_null
      - name: COLL_DED
        description: Collision deductible.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000
      - name: MIS_LOB
        description: Miscellaneous line of business.
        tests:
          - not_null
      - name: SOURCE_IND_DERIVED
        description: Derived source indicator.
        tests:
          - not_null