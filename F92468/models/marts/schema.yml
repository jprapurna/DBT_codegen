version: 2

models:
  - name: niss_auto_atprm_detail
    description: This model serves as the final output for reporting or analytics, representing the NISS Auto ATPRM Detail.
    meta:
      owner: data_team
      domain: auto_insurance
    config:
      materialized: view
    tags: ['reporting', 'analytics']
    columns:
      - name: NISS_APRM_DETL_SK
        description: Unique identifier for NISS APRM Detail.
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: NISS_CLASS_CD
        description: Code representing the class of NISS.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Indemnity', 'Auto_1A', 'Auto_4', 'Auto_5', 'Auto_6']
      - name: REC_EXCPN_IND
        description: Indicator for record exception.
        tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']
      - name: REC_EXCP_DESC
        description: Description of the record exception.
        tests:
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              min_value: 0
              max_value: 255

  - name: niss_cvg_cd_detail
    description: Final model for reporting or analytics on NISS_CVG_CD.
    meta:
      owner: data_team
      domain: auto_insurance
    config:
      materialized: view
    tags: ['reporting', 'analytics']
    columns:
      - name: NISS_APRM_DETL_SK
        description: Unique identifier for NISS APRM Detail.
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: NISS_CVG_CD
        description: Coverage code for NISS.
        tests:
          - not_null
      - name: NISS_SSL_LIAB_CD
        description: SSL liability code for NISS.
        tests:
          - not_null
      - name: NISS_LIAB_OR_NO_FAULT_CD
        description: Liability or no-fault code for NISS.
        tests:
          - not_null
      - name: REC_EXCPN_IND
        description: Indicator for record exception.
        tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']
      - name: BI_LMT_1_Decimal
        description: First decimal limit for BI.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: BI_LMT_2_Decimal
        description: Second decimal limit for BI.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: BI_LMT_3_Decimal
        description: Third decimal limit for BI.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: BI_LMT_NO_OF_PARTS
        description: Number of parts for BI limit.
        tests:
          - not_null
      - name: SRC_BI_LMT
        description: Source of BI limit.
        tests:
          - not_null
      - name: CVG_AMT_1_Decimal
        description: First decimal amount for coverage.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: CVG_AMT_2_Decimal
        description: Second decimal amount for coverage.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: CVG_AMT_3_Decimal
        description: Third decimal amount for coverage.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: CVG_AMT_NO_OF_PARTS
        description: Number of parts for coverage amount.
        tests:
          - not_null
      - name: SRC_CVG_AMT
        description: Source of coverage amount.
        tests:
          - not_null

  - name: detailed_data
    description: Load detailed data for NISS auto territory reporting.
