        tests:
          - not_null
      - name: niss_cmpny_cd
        description: NISS company code.
        tests:
          - not_null
      - name: st_nm
        description: State name.
        tests:
          - not_null
      - name: st_cd
        description: State code.
        tests:
          - not_null
      - name: niss_st_cd
