version: 2

sources:
  - name: GENAI_POWER_BI_CDM
    description: Source tables from GENAI_POWER_BI database in CDM schema.
    database: GENAI_POWER_BI
    schema: CDM

    tables:
      - name: CDH_GW_BUR
        description: Table 'CDH_GW_BUR' does not exist or not authorized.
        identifier: CDH_GW_BUR

      - name: W_CLAIM_CD_BUR_SCD3
        description: Table 'W_CLAIM_CD_BUR_SCD3' does not exist or not authorized.
        identifier: W_CLAIM_CD_BUR_SCD3

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim codes.
        identifier: LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: LKP_ROW_WID
            description: Row identifier.
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Integration ID for lookup.
            tests:
              - not_null
          - name: LKP_NEW_BUR
            description: New BUR value for lookup.
            tests:
              - not_null

      - name: SQ_CDH_GW_BUR
        description: Source query for CDH_GW_BUR.
        identifier: SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy.
            tests:
              - not_null
          - name: BUR
            description: BUR value.
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Name of the source.
            tests:
              - not_null

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row width.
        identifier: LKP_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Row width identifier.
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table.
            tests:
              - not_null

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for batch control IDs.
        identifier: LKP_CDM_BATCH_CTRLID
        columns:
          - name: SOURCE_NAME
            description: Name of the source.
            tests:
              - not_null
          - name: BATCH_ID
            description: Batch identifier.
            tests:
              - not_null
          - name: STATUS
            description: Status of the batch.
            tests:
              - not_null
              - accepted_values:
                  values: ['Active', 'Inactive', 'Pending']