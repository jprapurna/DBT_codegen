version: 2

sources:
  - name: cdh_gw_bur
    description: Source table for CDH Gateway BUR data
    database: CDH_GWODS
    schema: CDH_GWODS
    tables:
      - name: sq_cdh_gw_bur
        description: Staging table for CDH Gateway BUR data
        identifier: CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR identifier
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Source name for the data
            tests:
              - not_null

  - name: claim_cd_bur_scd3
    description: Lookup table for claim CD BUR SCD3 data
    database: CDM
    schema: CDM
    tables:
      - name: lkp_w_claim_cd_bur_scd3
        description: Lookup table for claim CD BUR SCD3
        identifier: W_CLAIM_CD_BUR_SCD3
        columns:
          - name: LKP_ROW_WID
            description: Lookup row identifier
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
          - name: LKP_NEW_BUR
            description: Lookup new BUR value
            tests:
              - not_null

  - name: max_row_wid
    description: Lookup table for maximum row WID
    database: CDM
    schema: CDM
    tables:
      - name: lkp_max_row_wid
        description: Lookup table for maximum row WID
        identifier: MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Maximum row identifier
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table
            tests:
              - not_null

  - name: cdm_batch_ctrlid
    description: Lookup table for CDM batch control ID
    database: CDM
    schema: CDM
    tables:
      - name: lkp_cdm_batch_ctrlid
        description: Lookup table for CDM batch control ID
        identifier: CDM_BATCH_CTRLID
        columns:
          - name: SOURCE_NAME
            description: Source name for the batch
            tests:
              - not_null
          - name: BATCH_ID
            description: Batch identifier
            tests:
              - not_null
              - unique
          - name: STATUS
            description: Status of the batch
            tests:
              - not_null
              - accepted_values:
                  values: ['RUNNING', 'COMPLETED', 'FAILED']