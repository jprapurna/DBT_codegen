version: 2

sources:
  - name: CDH_GW_BUR
    description: Source table for CDH Gateway BUR data
    database: genai_power_bi
    schema: CDH_GWODS

    tables:
      - name: SQ_CDH_GW_BUR
        description: Staging table for CDH Gateway BUR data
        identifier: DUMMY_SQ_CDH_GW_BUR

        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR identifier
            tests:
              - not_null
              - unique
          - name: SOURCE_NAME
            description: Source name for the data
            tests:
              - not_null
              - unique

  - name: W_CLAIM_CD_BUR_SCD3
    description: Lookup table for claim code BUR data
    database: genai_power_bi
    schema: CDM

    tables:
      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim code BUR data
        identifier: DUMMY_LKP_W_CLAIM_CD_BUR_SCD3

        columns:
          - name: LKP_ROW_WID
            description: Lookup row identifier
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration identifier
            tests:
              - not_null
              - unique
          - name: LKP_NEW_BUR
            description: Lookup new BUR value
            tests:
              - not_null
              - unique

  - name: MAX_ROW_WID
    description: Lookup table for maximum row width
    database: genai_power_bi
    schema: CDM

    tables:
      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row width
        identifier: DUMMY_mplt_CDM_ROW_WID_lkp_MAX_ROW_WID

        columns:
          - name: ROW_WID
            description: Maximum row width
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table
            tests:
              - not_null
              - unique

  - name: CDM_BATCH_CTRLID
    description: Lookup table for batch control ID
    database: genai_power_bi
    schema: CDM

    tables:
      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for batch control ID
        identifier: DUMMY_mplt_CDM_BATCH_ID_lkp_CDM_BATCH_CTRLID

        columns:
          - name: SOURCE_NAME
            description: Source name for the batch
            tests:
              - not_null
              - unique
          - name: BATCH_ID
            description: Batch identifier
            tests:
              - not_null
              - unique
          - name: STATUS
            description: Status of the batch
            tests:
              - not_null
              - accepted_values:
                  values: ['RUNNING', 'COMPLETED', 'FAILED']