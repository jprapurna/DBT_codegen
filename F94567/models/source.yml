version: 2

sources:
  - name: DBA_COMMON_UTILS
    description: Data source for common utilities
    database: DBA_COMMON_UTILS
    schema: DBA

    tables:
      - name: SQ_CDH_GW_BUR
        description: Source table for CDH Gateway BUR
        identifier: SQ_CDH_GW_BUR

        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR identifier
            tests:
              - not_null
              - unique
          - name: SOURCE_NAME
            description: Name of the source
            tests:
              - not_null
              - unique

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim codes BUR SCD3
        identifier: LKP_W_CLAIM_CD_BUR_SCD3

        columns:
          - name: LKP_ROW_WID
            description: Lookup row identifier
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
              - unique
          - name: LKP_NEW_BUR
            description: New BUR lookup value
            tests:
              - not_null
              - unique

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row width
        identifier: LKP_MAX_ROW_WID

        columns:
          - name: ROW_WID
            description: Row identifier
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table
            tests:
              - not_null
              - unique

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for CDM batch control ID
        identifier: LKP_CDM_BATCH_CTRLID

        columns:
          - name: SOURCE_NAME
            description: Name of the source
            tests:
              - not_null
              - unique
          - name: BATCH_ID
            description: Batch identifier
            tests:
              - not_null
              - unique
          - name: STATUS
            description: Status of the batch
            tests:
              - not_null
              - unique

      - name: CDH_GW_BUR
        description: CDH Gateway BUR table
        identifier: CDH_GW_BUR

        columns: []

      - name: W_CLAIM_CD_BUR_SCD3
        description: Claim codes BUR SCD3 table
        identifier: W_CLAIM_CD_BUR_SCD3

        columns: []