version: 2

models:
  - name: fct_claims__final  # Required
    description: This model aggregates business KPIs and operational metrics, combining calculated metrics for financial and operational performance analysis.
    meta:
      owner: data_team  # Optional metadata
      domain: finance
    config:
      materialized: table
    tags: [finance, kpis]
    columns:
      - name: Revenue
        description: Revenue generated by the business.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000000
      - name: Profit
        description: Profit earned by the business.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000000
      - name: ROI
        description: Return on Investment calculated for the business.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: Calculated_KPIs
        description: Aggregated KPIs calculated using macro_business_kpis function for financial metrics.
        tests:
          - not_null
      - name: Efficiency
        description: Operational efficiency metric.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: Volume
        description: Operational volume metric.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
      - name: Quality
        description: Operational quality metric.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: Calculated_Metrics
        description: Aggregated metrics calculated using macro_business_kpis function for operational metrics.
        tests:
          - not_null