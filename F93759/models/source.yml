version: 2

sources:
  - name: CDH_GWODS
    description: Source tables for CDH Gateway Operational Data Store
    database: genai_power_bi
    schema: CDH_GWODS

    tables:
      - name: SQ_CDH_GW_BUR
        description: Source table for CDH Gateway BUR
        identifier: SQ_CDH_GW_BUR

        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR identifier
            tests:
              - not_null
              - unique
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null
              - unique

  - name: CDM
    description: Source tables for Claims Data Mart
    database: genai_power_bi
    schema: CDM

    tables:
      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for Claim Code BUR SCD3
        identifier: LKP_W_CLAIM_CD_BUR_SCD3

        columns:
          - name: LKP_ROW_WID
            description: Lookup row ID
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
              - unique
          - name: LKP_NEW_BUR
            description: Lookup new BUR
            tests:
              - not_null
              - unique

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row ID
        identifier: LKP_MAX_ROW_WID

        columns:
          - name: ROW_WID
            description: Row ID
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table
            tests:
              - not_null
              - unique

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for CDM batch control ID
        identifier: LKP_CDM_BATCH_CTRLID

        columns:
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null
              - unique
          - name: BATCH_ID
            description: Batch ID
            tests:
              - not_null
              - unique

      - name: W_CLAIM_CD_BUR_SCD3
        description: Table for Claim Code BUR SCD3
        identifier: W_CLAIM_CD_BUR_SCD3

        columns:
          - name: BUR
            description: BUR identifier
            tests:
              - not_null
              - unique
          - name: LKP_NEW_BUR
            description: Lookup new BUR
            tests:
              - not_null
              - unique
          - name: O_FLAG
            description: Operational flag
            tests:
              - not_null
              - unique
          - name: IN_INTEGRATION_ID
            description: Integration ID
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
              - unique
          - name: LKP_ROW_WID
            description: Lookup row ID
            tests:
              - not_null
              - unique
          - name: BATCH_ID
            description: Batch ID
            tests:
              - not_null
              - unique
          - name: NEW_BUR
            description: New BUR identifier
            tests:
              - not_null
              - unique
          - name: OLD_BUR
            description: Old BUR identifier
            tests:
              - not_null
              - unique
          - name: ROW_WID
            description: Row ID
            tests:
              - not_null
              - unique