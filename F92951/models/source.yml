version: 2

sources:
  - name: IICS
    description: Workflow generated by PC2Cloud
    database: 
    schema: CDM

    tables:
      - name: SQ_CDH_GW_BUR
        description: Source table for CDH Gateway BUR
        identifier: DUMMY_SQ_CDH_GW_BUR

        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
          - name: BUR
            description: BUR value
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for W_CLAIM_CD_BUR_SCD3
        identifier: DUMMY_LKP_W_CLAIM_CD_BUR_SCD3

        columns:
          - name: LKP_ROW_WID
            description: Lookup row WID
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
          - name: LKP_NEW_BUR
            description: Lookup new BUR
            tests:
              - not_null

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row WID
        identifier: DUMMY_mplt_CDM_ROW_WID_lkp_MAX_ROW_WID

        columns:
          - name: ROW_WID
            description: Maximum row WID
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table
            tests:
              - not_null

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for CDM batch control ID
        identifier: DUMMY_mplt_CDM_BATCH_ID_lkp_CDM_BATCH_CTRLID

        columns:
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null
          - name: BATCH_ID
            description: Batch ID
            tests:
              - not_null
              - unique