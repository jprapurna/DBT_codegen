version: 2

sources:
  - name: genai_power_bi
    description: Source database for Power BI integration
    database: genai_power_bi
    schema: default
    tables:
      - name: SQ_CDH_GW_BUR
        description: Source table for CDH Gateway BUR data
        identifier: SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR value
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null
              - unique
      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim code BUR SCD3
        identifier: LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: LKP_ROW_WID
            description: Lookup row ID
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
              - unique
          - name: LKP_NEW_BUR
            description: Lookup new BUR value
            tests:
              - not_null
      - name: lkp_CDM_BATCH_CTRLID
        description: Lookup table for CDM batch control ID
        identifier: lkp_CDM_BATCH_CTRLID
        columns:
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null
              - unique
          - name: BATCH_ID
            description: Batch ID
            tests:
              - not_null
              - unique
      - name: lkp_MAX_ROW_WID
        description: Lookup table for maximum row width
        identifier: lkp_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Row width
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Table name
            tests:
              - not_null
              - unique