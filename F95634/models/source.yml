version: 2

sources:
  - name: GENAI_POWER_BI_CDM
    description: Source tables from GENAI_POWER_BI database within the CDM schema.
    database: GENAI_POWER_BI
    schema: CDM

    tables:
      - name: SQ_CDH_GW_BUR
        description: Table containing policy state, BUR, and source name information.
        identifier: SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy.
            tests:
              - not_null
          - name: BUR
            description: BUR information.
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Name of the source.
            tests:
              - not_null

      - name: CDH_GW_BUR
        description: Table does not exist or not authorized.
        identifier: CDH_GW_BUR

      - name: W_CLAIM_CD_BUR_SCD3_I
        description: Table does not exist or not authorized.
        identifier: W_CLAIM_CD_BUR_SCD3_I

      - name: W_CLAIM_CD_BUR_SCD3_U
        description: Table does not exist or not authorized.
        identifier: W_CLAIM_CD_BUR_SCD3_U

      - name: DEV_CLM_BI_CDM_W_CLAIM_CD_BUR_SCD3
        description: Table contains syntax error in metadata.
        identifier: DEV_CLM_BI/CDM/W_CLAIM_CD_BUR_SCD3

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim BUR SCD3.
        identifier: LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: LKP_ROW_WID
            description: Row identifier for lookup.
            tests:
              - not_null
          - name: LKP_INTEGRATION_ID
            description: Integration ID for lookup.
            tests:
              - not_null
          - name: LKP_NEW_BUR
            description: New BUR value for lookup.
            tests:
              - not_null

      - name: MPLT_CDM_BATCH_ID_LKP_CDM_BATCH_CTRLID
        description: Table does not exist or not authorized.
        identifier: MPLT_CDM_BATCH_ID_LKP_CDM_BATCH_CTRLID

      - name: MPLT_CDM_ROW_WID_LKP_MAX_ROW_WID
        description: Table does not exist or not authorized.
        identifier: MPLT_CDM_ROW_WID_LKP_MAX_ROW_WID

      - name: W_CLAIM_CD_BUR_SCD3
        description: Table does not exist or not authorized.
        identifier: W_CLAIM_CD_BUR_SCD3