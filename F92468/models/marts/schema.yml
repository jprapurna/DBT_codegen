version: 2

models:
  - name: fct_claim_cd_bur_scd3  # Required
    description: This model represents claim data with BUR (Business Unit Reference) information, including new BUR values and flags for insert/update operations. It is sourced from the intermediate claim CD BUR SCD3 model.
    meta:
      owner: data_team
      domain: claims
    config:
      materialized: view
    tags: [claims, bur, scd3]
    columns:
      - name: ROW_WID
        description: Unique identifier for the row.
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: BUR
        description: Original Business Unit Reference (BUR) associated with the claim.
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              min_value: 1
              max_value: 50
      - name: NEW_BUR
        description: Updated Business Unit Reference (BUR) for the claim.
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              min_value: 1
              max_value: 50
      - name: CDM_INSERT_DT
        description: Timestamp indicating when the record was inserted into the system.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: '2000-01-01'
              max_value: '2100-01-01'
      - name: CDM_UPDATE_DT
        description: Timestamp indicating when the record was last updated in the system.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: '2000-01-01'
              max_value: '2100-01-01'
      - name: o_Flag
        description: Operational flag indicating the type of operation ('I' for insert, 'U' for update).
        tests:
          - not_null
          - accepted_values:
              values: ['I', 'U']
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['I', 'U']