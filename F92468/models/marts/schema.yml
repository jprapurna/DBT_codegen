version: 2

models:
  - name: fct_claims__processed  # Required
    description: This model represents processed claims data, including metadata and flags for tracking updates and inserts.
    meta:
      owner: data_team  # Optional metadata
      domain: claims_processing
    config:
      materialized: table
    tags: [claims, processed_data]
    columns:
      - name: ROW_WID
        description: Unique identifier for each row in the claims data.
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: o_Flag
        description: Operational flag indicating the status or type of the claim.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['active', 'inactive', 'pending']  # Example values inferred from flag usage
      - name: CDM_INSERT_DT
        description: Timestamp indicating when the claim record was inserted.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: '2000-01-01'
              max_value: '2100-01-01'
      - name: CDM_UPDATE_DT
        description: Timestamp indicating when the claim record was last updated.
        tests:
          - dbt_expectations.expect_column_values_to_be_dateutil_parseable
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: '2000-01-01'
              max_value: '2100-01-01'
      - name: TGT_TABLE_NAME
        description: Name of the target table where the claim data is stored.
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              min_value: 3
              max_value: 50