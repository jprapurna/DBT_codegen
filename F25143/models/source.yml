version: 2

sources:
  - name: AGDM
    description: Source for AGDM tables
    database: AGDM
    schema: public
    tables:
      - name: DIM_AG_TRANS_TYP_PLCY
        description: Table for transaction type policy
        identifier: DIM_AG_TRANS_TYP_PLCY
        columns:
          - name: TRANS_TYP_PLCY_SK
            description: Surrogate key for transaction type policy
            tests:
              - not_null
              - unique
          - name: TRANS_TYP_PLCY_CD
            description: Code for transaction type policy
            tests:
              - not_null
          - name: TRANS_TYP_PLCY_DESC
            description: Description for transaction type policy
            tests:
              - not_null

      - name: DIM_AG_FARMR_GEO_ST
        description: Table for farmer geographic state
        identifier: DIM_AG_FARMR_GEO_ST
        columns:
          - name: FARMR_GEO_ST_SK
            description: Surrogate key for farmer geographic state
            tests:
              - not_null
              - unique
          - name: CHK_SUM_ATTR
            description: Checksum attribute
          - name: ST_CD
            description: State code
            tests:
              - not_null
          - name: ST_NM
            description: State name
            tests:
              - not_null
          - name: ZONE
            description: Zone information
          - name: CORE_29_IND
            description: Core 29 indicator

      - name: DIM_AG_MINI_SOI
        description: Table for mini SOI
        identifier: DIM_AG_MINI_SOI
        columns:
          - name: MINI_SOI_SK
            description: Surrogate key for mini SOI
            tests:
              - not_null
              - unique
          - name: CHK_SUM_ATTR
            description: Checksum attribute
          - name: VEH_TYP_CD
            description: Vehicle type code
          - name: VEH_TYP_DESC
            description: Vehicle type description
          - name: SOI_CTGY
            description: SOI category
          - name: VEH_USE_CD
            description: Vehicle use code

      - name: DIM_AG_MINI_PLCY
        description: Table for mini policy
        identifier: DIM_AG_MINI_PLCY
        columns:
          - name: MINI_PLCY_SK
            description: Surrogate key for mini policy
            tests:
              - not_null
              - unique
          - name: CHK_SUM_ATTR
            description: Checksum attribute
          - name: MKT_TIER_FA2
            description: Market tier FA2
          - name: PAY_PLAN_CD
            description: Payment plan code
          - name: PAY_PLAN_DESC
            description: Payment plan description
          - name: PERSTNCY_YRS_RNGE
            description: Persistency years range

      - name: DIM_AG_PLCY_ENH
        description: Table for policy enhancement
        identifier: DIM_AG_PLCY_ENH
        columns:
          - name: PLCY_ENH_SK
            description: Surrogate key for policy enhancement
            tests:
              - not_null
              - unique
          - name: PLCY_ID_SK
            description: Policy ID surrogate key
          - name: SRC_TRANS_TMSP
            description: Source transaction timestamp
          - name: SRC_EFF_DT
            description: Source effective date
          - name: ON_OFF_PREM_TYP_RECRD
            description: On/off premium type record

      - name: FACT_AG_WRITTN_PREM_CVG_LVL
        description: Fact table for written premium coverage level
        identifier: FACT_AG_WRITTN_PREM_CVG_LVL
        columns:
          - name: ON_OFF_PREM_SK
            description: Surrogate key for on/off premium
            tests:
              - not_null
              - unique
          - name: REGSTR_PER_SK
            description: Registration period surrogate key
          - name: SRC_TRANS_TMSP
            description: Source transaction timestamp
          - name: TRANS_DT_SK
            description: Transaction date surrogate key
          - name: DNSTRM_DT_SK
            description: Downstream date surrogate key

      - name: DIM_AG_SOI
        description: Table for SOI
        identifier: DIM_AG_SOI
        columns:
          - name: SOI_SK
            description: Surrogate key for SOI
            tests:
              - not_null
              - unique
          - name: CHK_SUM_ATTR
            description: Checksum attribute
          - name: SOI_ID
            description: SOI ID
          - name: VIN
            description: Vehicle identification number
          - name: VEH_INCEPT_DT
            description: Vehicle inception date

      - name: DIM_AG_CVG
        description: Table for coverage
        identifier: DIM_AG_CVG
        columns:
          - name: CVG_SK
            description: Surrogate key for coverage
            tests:
              - not_null
              - unique
          - name: CHK_SUM_ATTR
            description: Checksum attribute
          - name: ACCTNG_LOB
            description: Accounting line of business
          - name: LOB
            description: Line of business
          - name: CVG_TYP_CD
            description: Coverage type code

      - name: DIM_AG_PLCY
        description: Table for policy
        identifier: DIM_AG_PLCY
        columns:
          - name: PLCY_SK
            description: Surrogate key for policy
            tests:
              - not_null
              - unique
          - name: CHK_SUM_ATTR
            description: Checksum attribute
          - name: PLCY_ID_SK
            description: Policy ID surrogate key
          - name: PLCY_CNTRCT_NUM
            description: Policy contract number
          - name: PLCY_INCEPT_DT
            description: Policy inception date

      - name: DIM_AG_SOI_ENH
        description: Table for SOI enhancement
        identifier: DIM_AG_SOI_ENH
        columns:
          - name: SOI_ENH_SK
            description: Surrogate key for SOI enhancement
            tests:
              - not_null
              - unique
          - name: PLCY_ID_SK
            description: Policy ID surrogate key
          - name: SOI_ID
            description: SOI ID
          - name: SRC_TRANS_TMSP
            description: Source transaction timestamp
          - name: SRC_EFF_DT
            description: Source effective date

      - name: DIM_AG_RATED_GEO
        description: Table for rated geography
        identifier: DIM_AG_RATED_GEO
        columns:
          - name: RATED_GEO_SK
            description: Surrogate key for rated geography
            tests:
              - not_null
              - unique
          - name: CHK_SUM_ATTR
            description: Checksum attribute
          - name: GRGNG_ZIP_3
            description: Garage ZIP code (3 digits)
          - name: GRGNG_ZIP_5
            description: Garage ZIP code (5 digits)
          - name: GRGNG_ZIP_PLUS4
            description: Garage ZIP code (plus 4 digits)

      - name: DIM_AG_CVG_ENH
        description: Table for coverage enhancement
        identifier: DIM_AG_CVG_ENH
        columns:
          - name: ON_OFF_PREM_SK
            description: Surrogate key for on/off premium
            tests:
              - not_null
              - unique
          - name: PLCY_ID_SK
            description: Policy ID surrogate key
          - name: SOI_ID
            description: SOI ID
          - name: CVG_CD
            description: Coverage code
          - name: LOB
            description: Line of business

  - name: PowerExchange_For_Snowflake
    description: Source for Snowflake tables
    database: PowerExchange_For_Snowflake
    schema: public
    tables:
      - name: WRK_BIRP_NISS_APRM_DETL
        description: Work table for NISS APRM details
        identifier: WRK_BIRP_NISS_APRM_DETL
        columns:
          - name: NISS_APRM_DETL_SK
            description: Surrogate key for NISS APRM details
            tests:
              - not_null
              - unique
          - name: CLNDR_YR
            description: Calendar year
          - name: CALL_YR
            description: Call year
          - name: NAIC_CMPNY_CD
            description: NAIC company code
          - name: NISS_CMPNY_CD
            description: NISS company code

      - name: WRK_BIRP_NISS_APRM_FINAL
        description: Work table for NISS APRM final
        identifier: WRK_BIRP_NISS_APRM_FINAL
        columns:
          - name: NISS_APRM_FINAL_SK
            description: Surrogate key for NISS APRM final
            tests:
              - not_null
              - unique
          - name: CLNDR_YR
            description: Calendar year
          - name: CALL_YR
            description: Call year
          - name: NISS_CMPNY_CD
            description: NISS company code
          - name: ST_NM
            description: State name

      - name: WRK_BIRP_TA_NISS_NU0C_APRM_DTL
        description: Work table for TA NISS NU0C APRM details
        identifier: WRK_BIRP_TA_NISS_NU0C_APRM_DTL
        columns:
          - name: FISC_PER_YR
            description: Fiscal period year
          - name: NAIC_CMPNY_CD
            description: NAIC company code
          - name: NISS_CMPNY_CD
            description: NISS company code
          - name: ST_NM
            description: State name
          - name: ST_CD
            description: State code

      - name: WRK_BIRP_TA_NISS_NU0C_APRM_LND
        description: Work table for TA NISS NU0C APRM land
        identifier: WRK_BIRP_TA_NISS_NU0C_APRM_LND
        columns:
          - name: NISS_APRM_LND_SK
            description: Surrogate key for NISS APRM land
            tests:
              - not_null
              - unique
          - name: REG_PER_YR
            description: Registration period year
          - name: FISC_PER_YR
            description: Fiscal period year
          - name: NAIC_CMPNY_CD
            description: NAIC company code
          - name: NISS_CMPNY_CD
            description: NISS company code