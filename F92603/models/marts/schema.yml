version: 2

models:
  - name: fct_niss_auto_103_atprm_dtl_upd_classcd
    description: Final model for reporting or analytics based on the update and expression transformations.
    meta:
      owner: data_team
      domain: insurance
    config:
      materialized: view
    tags: ['insurance', 'analytics']
    columns:
      - name: NISS_APRM_DETL_SK
        description: Unique identifier for NISS APRM detail.
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_unique
      - name: NISS_CLASS_CD
        description: Class code for NISS.
        tests:
          - not_null
      - name: REC_EXCPN_IND
        description: Indicator for record exception.
        tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']
      - name: REC_EXCPN_RSN_DESC
        description: Description of the reason for record exception.
      - name: ST_ABBR
        description: State abbreviation.
        tests:
          - not_null
      - name: ST_CD
        description: State code.
        tests:
          - not_null
      - name: RATNG_CMPY_CD
        description: Rating company code.
      - name: MLT_CAR_IND
        description: Indicator for multiple cars.
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: RT_CLS
        description: Rating class.
      - name: AGE
        description: Age of the individual.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 120
      - name: GENDR
        description: Gender of the individual.
        tests:
          - accepted_values:
              values: ['M', 'F', 'O']
      - name: MRTL_STAT
        description: Marital status.
        tests:
          - accepted_values:
              values: ['Single', 'Married', 'Divorced', 'Widowed']
      - name: auto_use_cd
        description: Code for auto use.
      - name: iage
        description: Inferred age.
      - name: imiles_to_wrk
        description: Inferred miles to work.
      - name: GOOD_STDNT_IND
        description: Indicator for good student.
