version: 2

sources:
  - name: AGDM
    description: Source data from AGDM database
    database: DBA_COMMON_UTILS
    schema: DBA
    tables:
      - name: DIM_AG_TRANS_TYP_PLCY
        description: Transaction type policy dimension table
        identifier: DIM_AG_TRANS_TYP_PLCY
        columns:
          - name: TRANS_TYP_PLCY_SK
            description: Surrogate key for transaction type policy
            tests:
              - not_null
              - unique
          - name: TRANS_TYP_PLCY_CD
            description: Code for transaction type policy
            tests:
              - not_null
          - name: TRANS_TYP_PLCY_DESC
            description: Description of transaction type policy
            tests:
              - not_null

      - name: DIM_AG_FARMR_GEO_ST
        description: Farmer geographic state dimension table
        identifier: DIM_AG_FARMR_GEO_ST
        columns:
          - name: FARMR_GEO_ST_SK
            description: Surrogate key for farmer geographic state
            tests:
              - not_null
              - unique
          - name: ST_CD
            description: State code
            tests:
              - not_null
          - name: ST_NM
            description: State name
            tests:
              - not_null

      - name: DIM_AG_MINI_SOI
        description: Mini SOI dimension table
        identifier: DIM_AG_MINI_SOI
        columns:
          - name: MINI_SOI_SK
            description: Surrogate key for mini SOI
            tests:
              - not_null
              - unique
          - name: VEH_TYP_CD
            description: Vehicle type code
            tests:
              - not_null
          - name: VEH_TYP_DESC
            description: Vehicle type description
            tests:
              - not_null

      - name: DIM_AG_MINI_PLCY
        description: Mini policy dimension table
        identifier: DIM_AG_MINI_PLCY
        columns:
          - name: MINI_PLCY_SK
            description: Surrogate key for mini policy
            tests:
              - not_null
              - unique
          - name: PAY_PLAN_CD
            description: Payment plan code
            tests:
              - not_null
          - name: PAY_PLAN_DESC
            description: Payment plan description
            tests:
              - not_null

      - name: DIM_AG_PLCY_ENH
        description: Policy enhancement dimension table
        identifier: DIM_AG_PLCY_ENH
        columns:
          - name: PLCY_ENH_SK
            description: Surrogate key for policy enhancement
            tests:
              - not_null
              - unique
          - name: CIF_CD
            description: CIF code
            tests:
              - not_null
          - name: CIF_CD_DESC
            description: CIF code description
            tests:
              - not_null

      - name: FACT_AG_WRITTN_PREM_CVG_LVL
        description: Written premium coverage level fact table
        identifier: FACT_AG_WRITTN_PREM_CVG_LVL
        columns:
          - name: ON_OFF_PREM_SK
            description: Surrogate key for on/off premium
            tests:
              - not_null
              - unique
          - name: WRITTN_PREM_AMT
            description: Written premium amount
            tests:
              - not_null
          - name: TTL_WRITTN_PREM_AMT
            description: Total written premium amount
            tests:
              - not_null

      - name: DIM_AG_SOI
        description: SOI dimension table
        identifier: DIM_AG_SOI
        columns:
          - name: SOI_SK
            description: Surrogate key for SOI
            tests:
              - not_null
              - unique
          - name: SOI_ID
            description: SOI identifier
            tests:
              - not_null
          - name: VIN
            description: Vehicle identification number
            tests:
              - not_null

      - name: DIM_AG_CVG
        description: Coverage dimension table
        identifier: DIM_AG_CVG
        columns:
          - name: CVG_SK
            description: Surrogate key for coverage
            tests:
              - not_null
              - unique
          - name: ACCTNG_LOB
            description: Accounting line of business
            tests:
              - not_null
          - name: CVG_TYP_CD
            description: Coverage type code
            tests:
              - not_null

      - name: DIM_AG_PLCY
        description: Policy dimension table
        identifier: DIM_AG_PLCY
        columns:
          - name: PLCY_SK
            description: Surrogate key for policy
            tests:
              - not_null
              - unique
          - name: PLCY_CNTRCT_NUM
            description: Policy contract number
            tests:
              - not_null
          - name: TERM_STRT_DT
            description: Term start date
            tests:
              - not_null

      - name: DIM_AG_SOI_ENH
        description: SOI enhancement dimension table
        identifier: DIM_AG_SOI_ENH
        columns:
          - name: SOI_ENH_SK
            description: Surrogate key for SOI enhancement
            tests:
              - not_null
              - unique
          - name: SOI_ID
            description: SOI identifier
            tests:
              - not_null
          - name: ADD_UNIT_IND
            description: Additional unit indicator
            tests:
              - not_null

      - name: DIM_AG_RATED_GEO
        description: Rated geographic dimension table
        identifier: DIM_AG_RATED_GEO
        columns:
          - name: RATED_GEO_SK
            description: Surrogate key for rated geography
            tests:
              - not_null
              - unique
          - name: GRGNG_ZIP_5
            description: Garage ZIP code (5 digits)
            tests:
              - not_null
          - name: FARMR_GEO_ST_SK
            description: Farmer geographic state surrogate key
            tests:
              - not_null

      - name: DIM_AG_CVG_ENH
        description: Coverage enhancement dimension table
        identifier: DIM_AG_CVG_ENH
        columns:
          - name: ON_OFF_PREM_SK
            description: Surrogate key for on/off premium
            tests:
              - not_null
              - unique
          - name: CVG_CD
            description: Coverage code
            tests:
              - not_null
          - name: LOB
            description: Line of business
            tests:
              - not_null

  - name: PowerExchange_For_Snowflake
    description: Source data from PowerExchange for Snowflake
    database: DBA_COMMON_UTILS
    schema: DBA
    tables:
      - name: WRK_BIRP_NISS_APRM_DETL
        description: Work table for NISS APRM details
        identifier: WRK_BIRP_NISS_APRM_DETL
        columns:
          - name: NISS_APRM_DETL_SK
            description: Surrogate key for NISS APRM details
            tests:
              - not_null
              - unique
          - name: CLNDR_YR
            description: Calendar year
            tests:
              - not_null
          - name: CALL_YR
            description: Call year
            tests:
              - not_null

      - name: WRK_BIRP_NISS_APRM_FINAL
        description: Work table for NISS APRM final details
        identifier: WRK_BIRP_NISS_APRM_FINAL
        columns:
          - name: NISS_APRM_FINAL_SK
            description: Surrogate key for NISS APRM final details
            tests:
              - not_null
              - unique
          - name: CLNDR_YR
            description: Calendar year
            tests:
              - not_null
          - name: CALL_YR
            description: Call year
            tests:
              - not_null

      - name: WRK_BIRP_TA_NISS_NU0C_APRM_DTL
        description: Work table for TA NISS NU0C APRM details
        identifier: WRK_BIRP_TA_NISS_NU0C_APRM_DTL
        columns:
          - name: FISC_PER_YR
            description: Fiscal period year
            tests:
              - not_null
          - name: NAIC_CMPNY_CD
            description: NAIC company code
            tests:
              - not_null
          - name: NISS_CMPNY_CD
            description: NISS company code
            tests:
              - not_null

      - name: WRK_BIRP_TA_NISS_NU0C_APRM_LND
        description: Work table for TA NISS NU0C APRM landing details
        identifier: WRK_BIRP_TA_NISS_NU0C_APRM_LND
        columns:
          - name: NISS_APRM_LND_SK
            description: Surrogate key for NISS APRM landing details
            tests:
              - not_null
              - unique
          - name: REG_PER_YR
            description: Registration period year
            tests:
              - not_null
          - name: FISC_PER_YR
            description: Fiscal period year
            tests:
              - not_null

      - name: FDR_LIB_WRK_BIRP_NISS_APRM_DETL1
        columns:
          - name: NISS_APRM_DETL_SK
            description: Surrogate key for NISS APRM landing details
            tests:
              - not_null
              - unique
          - name: NISS_PLCY_LMT_CD
            description: Registration period year
            tests:
              - not_null
          - name: update_flag
            description: Fiscal period year
            tests:
              - not_null


  - name: Flat_File_Lookup
    database: DBA_COMMON_UTILS
    schema: DBA
    tables:
      - name: Flat_File_Lookup
        columns:
          - name: i_ST_NM
            description: Surrogate key for on/off premium
            tests:
              - not_null
              - unique
          - name: FARMERS_STATE_NAME
            description: farmers code
            tests:
              - not_null
          - name: NISS_STATE_CODE
            description: state code
            tests:
              - not_null

  - name: BIRP
    database: DBA_COMMON_UTILS
    schema: DBA
    tables:
      - name: RBI_REF_AUTO_TERR
        columns:
          - name: NISS_ST_CD
            description: Surrogate key for on/off premium
            tests:
              - not_null
              - unique
          - name: ST_ABBRV
            description: farmers code
            tests:
              - not_null
          - name: ZIP_CD
            description: state code
            tests:
              - not_null

  - name: FDR
    database: DBA_COMMON_UTILS
    schema: DBA
    tables:
      - name: REF_TFARMERS_STATE
        columns:
          - name: FARMERS_STATE_CD
            description: Surrogate key for on/off premium
            tests:
              - not_null
              - unique

  - name: CDM
    database: DBA_COMMON_UTILS
    schema: DBA
    tables:
      - name: W_CLAIM_CD_BUR_SCD3
        columns:
