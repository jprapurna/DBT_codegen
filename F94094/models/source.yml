version: 2

sources:
  - name: CDH_GWODS
    description: Source for CDH Gateway data
    database: DBConnection_CDH_GWODS
    schema: CDH_GWODS
    tables:
      - name: SQ_CDH_GW_BUR
        description: Source query for CDH Gateway BUR data
        identifier: DUMMY_SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
          - name: BUR
            description: BUR data
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Source name for the data
            tests:
              - not_null

  - name: CDM
    description: Claims Data Mart
    database: DBConnection_CDM
    schema: CDM
    tables:
      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for W_CLAIM_CD_BUR_SCD3
        identifier: DUMMY_LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: lkp_ROW_WID
            description: Lookup ROW_WID
            tests:
              - not_null
              - unique
          - name: lkp_INTEGRATION_ID
            description: Lookup Integration ID
            tests:
              - not_null
              - unique
          - name: lkp_NEW_BUR
            description: Lookup NEW BUR
            tests:
              - not_null

      - name: lkp_CDM_BATCH_CTRLID
        description: Lookup table for CDM Batch Control ID
        identifier: DUMMY_mplt_CDM_BATCH_ID_lkp_CDM_BATCH_CTRLID
        columns:
          - name: BATCH_ID
            description: Batch ID
            tests:
              - not_null
              - unique
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null
              - unique

      - name: lkp_MAX_ROW_WID
        description: Lookup table for maximum ROW_WID
        identifier: DUMMY_mplt_CDM_ROW_WID_lkp_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Maximum ROW_WID
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Target table name
            tests:
              - not_null
              - unique

      - name: wf_W_CLAIM_CD_SCD3_IU
        description: Workflow for W_CLAIM_CD_SCD3 Insert/Update
        identifier: s_W_CLAIM_CD_SCD3_IU
        columns:
          - name: ROW_WID
            description: ROW_WID for the workflow
            tests:
              - not_null
              - unique
          - name: INTEGRATION_ID
            description: Integration ID for the workflow
            tests:
              - not_null
              - unique
          - name: NEW_BUR
            description: NEW BUR for the workflow
            tests:
              - not_null