version: 2

sources:
  - name: GENAI_POWER_BI_CDM
    description: Source tables from GENAI_POWER_BI database within the CDM schema.
    database: GENAI_POWER_BI
    schema: CDM

    tables:
      - name: SQ_CDH_GW_BUR
        description: Table containing policy state, BUR, and source name information.
        identifier: SQ_CDH_GW_BUR

        columns:
          - name: POLICY_STATE
            description: State of the policy.
            tests:
              - not_null
          - name: BUR
            description: BUR information.
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Name of the source.
            tests:
              - not_null

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim BUR information.
        identifier: LKP_W_CLAIM_CD_BUR_SCD3

        columns:
          - name: LKP_ROW_WID
            description: Row identifier for lookup.
            tests:
              - not_null
          - name: LKP_INTEGRATION_ID
            description: Integration ID for lookup.
            tests:
              - not_null
          - name: LKP_NEW_BUR
            description: New BUR value for lookup.
            tests:
              - not_null

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row identifier.
        identifier: LKP_MAX_ROW_WID

        columns:
          - name: ROW_WID
            description: Row identifier.
            tests:
              - not_null
          - name: TABLE_NAME
            description: Name of the table.
            tests:
              - not_null

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for batch control ID information.
        identifier: LKP_CDM_BATCH_CTRLID

        columns:
          - name: SOURCE_NAME
            description: Name of the source.
            tests:
              - not_null
          - name: BATCH_ID
            description: Batch identifier.
            tests:
              - not_null
          - name: STATUS
            description: Status of the batch.
            tests:
              - not_null

      - name: CDH_GW_BUR
        description: Table does not exist or is not authorized.
        identifier: CDH_GW_BUR

        columns: []

      - name: DEV_CLM_BI_CDM_W_CLAIM_CD_BUR_SCD3
        description: Table does not exist or contains syntax errors.
        identifier: DEV_CLM_BI/CDM/W_CLAIM_CD_BUR_SCD3

        columns: []

      - name: CDM_BATCH_CTRLID
        description: Table does not exist or is not authorized.
        identifier: CDM_BATCH_CTRLID

        columns: []