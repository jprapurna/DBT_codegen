version: 2

sources:
  - name: genai_power_bi
    description: Source for GENAI Power BI data
    database: genai_power_bi
    schema: cdm

    tables:
      - name: cdh_gw_bur
        description: Table for CDH GW BUR data
        identifier: cdh_gw_bur

        columns:
          - name: policy_state
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: bur
            description: BUR data
            tests:
              - not_null
              - unique

      - name: w_claim_cd_bur_scd3
        description: Table for W CLAIM CD BUR SCD3 data
        identifier: w_claim_cd_bur_scd3

        columns:
          - name: row_wid
            description: Row identifier
            tests:
              - not_null
              - unique
          - name: integration_id
            description: Integration identifier
            tests:
              - not_null
              - unique
          - name: new_bur
            description: New BUR data
            tests:
              - not_null
              - unique

      - name: cdm_batch_ctrlid
        description: Table for CDM Batch Control ID data
        identifier: cdm_batch_ctrlid

        columns:
          - name: batch_id
            description: Batch identifier
            tests:
              - not_null
              - unique
          - name: source_name
            description: Source name
            tests:
              - not_null
              - unique

      - name: max_row_wid
        description: Table for MAX ROW WID data
        identifier: max_row_wid

        columns:
          - name: row_wid
            description: Maximum row identifier
            tests:
              - not_null
              - unique
          - name: table_name
            description: Table name
            tests:
              - not_null
              - unique