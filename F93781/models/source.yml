version: 2

sources:
  - name: CDH_GWODS
    description: Source for CDH Gateway ODS data
    database: DBA_COMMON_UTILS
    schema: CDH_GWODS

    tables:
      - name: SQ_CDH_GW_BUR
        description: Source query for CDH Gateway BUR
        identifier: DUMMY_SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR value
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Source name for the data
            tests:
              - not_null

  - name: CDM
    description: Source for Claims Data Mart
    database: DBA_COMMON_UTILS
    schema: CDM

    tables:
      - name: W_CLAIM_CD_BUR_SCD3_I
        description: Insert operation for W_CLAIM_CD_BUR_SCD3
        identifier: DEV_CLM_BI/CDM/W_CLAIM_CD_BUR_SCD3
        columns:
          - name: ROW_WID
            description: Row identifier
            tests:
              - not_null
              - unique
          - name: INTEGRATION_ID
            description: Integration identifier
            tests:
              - not_null
          - name: NEW_BUR
            description: New BUR value
            tests:
              - not_null

      - name: W_CLAIM_CD_BUR_SCD3_U
        description: Update operation for W_CLAIM_CD_BUR_SCD3
        identifier: DEV_CLM_BI/CDM/W_CLAIM_CD_BUR_SCD3
        columns:
          - name: ROW_WID
            description: Row identifier
            tests:
              - not_null
              - unique
          - name: INTEGRATION_ID
            description: Integration identifier
            tests:
              - not_null
          - name: NEW_BUR
            description: New BUR value
            tests:
              - not_null

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for W_CLAIM_CD_BUR_SCD3
        identifier: DUMMY_LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: lkp_ROW_WID
            description: Lookup row identifier
            tests:
              - not_null
              - unique
          - name: lkp_INTEGRATION_ID
            description: Lookup integration identifier
            tests:
              - not_null
          - name: lkp_NEW_BUR
            description: Lookup new BUR value
            tests:
              - not_null

      - name: mplt_CDM_BATCH_ID_lkp_CDM_BATCH_CTRLID
        description: Mapplet for batch ID lookup in CDM_BATCH_CTRLID
        identifier: DUMMY_mplt_CDM_BATCH_ID_lkp_CDM_BATCH_CTRLID
        columns:
          - name: BATCH_ID
            description: Batch identifier
            tests:
              - not_null
              - unique
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null

      - name: mplt_CDM_ROW_WID_lkp_MAX_ROW_WID
        description: Mapplet for maximum row ID lookup
        identifier: DUMMY_mplt_CDM_ROW_WID_lkp_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Maximum row identifier
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Target table name
            tests:
              - not_null