    description: Source data from GENAI_POWER_BI database.
    database: GENAI_POWER_BI
    schema: POWER_CENTER

    tables:
      - name: rbi_ref_auto_terr
        description: Table containing reference data for auto territories.
        identifier: RBI_REF_AUTO_TERR
        columns:
          - name: ref_auto_terr_sk
            description: Surrogate key for auto territory reference.
            tests:
              - not_null
              - unique
          - name: end_eff_dt
            description: End effective date.
            tests:
              - not_null
          - name: chcksum
            description: Checksum for data validation.
          - name: cr_by_mapng_id
            description: ID of the creator mapping.
          - name: dw_cr_tmsp
            description: Timestamp of data warehouse creation.
          - name: upd_by_mapng_id
            description: ID of the updater mapping.
          - name: dw_upd_tmsp
            description: Timestamp of data warehouse update.
          - name: wrk_flow_run_id
            description: Workflow run identifier.
          - name: niss_terr_cd
            description: Nissan territory code.
          - name: cnty_nm
            description: County name.
          - name: city_nm
            description: City name.
          - name: src_eff_dt
            description: Source effective date.
          - name: src_obstlt_dt
            description: Source obsolete date.
          - name: niss_st_cd
            description: Nissan state code.
          - name: st_abbrv
            description: State abbreviation.
          - name: zip_cd
            description: Zip code.
          - name: pp_commrcl_cd
            description: Commercial code.

