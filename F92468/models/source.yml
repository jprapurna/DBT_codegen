version: 2

sources:
  - name: GENAI_POWER_BI
    description: Source data for CDM schema in GENAI_POWER_BI database
    database: GENAI_POWER_BI
    schema: CDM

    tables:
      - name: SQ_CDH_GW_BUR
        description: Source table for CDH Gateway BUR data
        identifier: SQ_CDH_GW_BUR
        columns:
          - name: POLICY_STATE
            description: State of the policy
            tests:
              - not_null
              - unique
          - name: BUR
            description: BUR value
            tests:
              - not_null
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null

      - name: LKP_W_CLAIM_CD_BUR_SCD3
        description: Lookup table for claim code BUR SCD3
        identifier: LKP_W_CLAIM_CD_BUR_SCD3
        columns:
          - name: LKP_ROW_WID
            description: Lookup row identifier
            tests:
              - not_null
              - unique
          - name: LKP_INTEGRATION_ID
            description: Lookup integration ID
            tests:
              - not_null
          - name: LKP_NEW_BUR
            description: Lookup new BUR value
            tests:
              - not_null

      - name: LKP_MAX_ROW_WID
        description: Lookup table for maximum row identifier
        identifier: LKP_MAX_ROW_WID
        columns:
          - name: ROW_WID
            description: Maximum row identifier
            tests:
              - not_null
              - unique
          - name: TABLE_NAME
            description: Name of the table
            tests:
              - not_null

      - name: LKP_CDM_BATCH_CTRLID
        description: Lookup table for CDM batch control ID
        identifier: LKP_CDM_BATCH_CTRLID
        columns:
          - name: SOURCE_NAME
            description: Source name
            tests:
              - not_null
          - name: BATCH_ID
            description: Batch identifier
            tests:
              - not_null
              - unique
          - name: STATUS
            description: Status of the batch
            tests:
              - not_null
              - accepted_values:
                  values: ['RUNNING', 'COMPLETED', 'FAILED']